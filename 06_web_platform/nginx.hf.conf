# AnaeroBio-Hub v4.0 — in-container nginx for Hugging Face Spaces (single public port 7860, runs as uid 1000).
#   /      → static landing page (/app/site)
#   /app/  → Streamlit (baseUrlPath=app, WebSocket-aware)
#   /api/, /docs, /openapi.json → FastAPI
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 2m;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_heavy:10m   rate=12r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 7860;
        server_name _;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ ^/api/v1/(contribute|predict_batch)$ {
            limit_req zone=api_heavy burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 300s;
        }
        location /api/ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }
        location = /app { return 301 /app/; }
        location /app/ {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 3600s;
        }
        location ~ ^/(docs|redoc|openapi\.json)$ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        root /app/site;
        index index.html;
        location /assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
